<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <title>Booking gennemført</title>

    <style>

        body {

            font-family: Arial;

            background-color: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

        }

        .box {

            background: white;

            padding: 40px;

            border-radius: 10px;

            text-align: center;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);

        }

        h1 {

            color: #1e3a8a;

        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background-color: #1e3a8a;

            color: white;

            text-decoration: none;

            border-radius: 5px;

        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Booking gennemført!</h1>

        <p><strong>Bane:</strong> {{ field }}</p>

        <p><strong>Træner:</strong> {{ trainer }}</p>

        <p><strong>Dato:</strong> {{ date }}</p>

        <p><strong>Tid:</strong> {{ time }}</p>

        <a href="/booking">

            Book igen

        </a>

    </div>

</body>

</html>

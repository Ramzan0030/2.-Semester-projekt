<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<title>Admin</title>

<style>

body{

font-family:Arial;
background:#f2f2f2;
padding:40px;

}

.box{

background:white;
padding:40px;
border-radius:10px;

}

table{

width:100%;
border-collapse:collapse;
margin-bottom:40px;

}

th,td{

padding:12px;
border:1px solid #ddd;

}

</style>

</head>

<body>

<div class="box">

<h1>Admin panel</h1>

<h2>Brugere</h2>

<table>

<tr>

<th>ID</th>
<th>Navn</th>
<th>Email</th>

</tr>

{% for user in users %}

<tr>

<td>{{user[0]}}</td>
<td>{{user[1]}}</td>
<td>{{user[2]}}</td>

</tr>

{% endfor %}

</table>

<h2>Bookinger</h2>

<table>

<tr>

<th>ID</th>
<th>Bruger</th>
<th>Træner</th>
<th>Dato</th>
<th>Tid</th>
<th>Slet</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{booking[0]}}</td>
<td>{{booking[1]}}</td>
<td>{{booking[2]}}</td>
<td>{{booking[3]}}</td>
<td>{{booking[4]}}</td>

<td>

<a href="/delete_booking/{{booking[0]}}">

Slet

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>

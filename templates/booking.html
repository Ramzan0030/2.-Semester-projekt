<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <title>Booking</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .navbar {

            background-color: #1e3a8a;

            padding: 20px;

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .navbar a {

            color: white;

            text-decoration: none;

        }

        .content {

            padding: 40px;

            display: flex;

            justify-content: center;

        }

        .card {

            background-color: white;

            padding: 40px;

            width: 500px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);

        }

        h1 {

            color: #1e3a8a;

            text-align: center;

            margin-bottom: 30px;

        }

        label {

            font-weight: bold;

        }

        select,
        input {

            width: 100%;

            padding: 12px;

            margin-top: 5px;

            margin-bottom: 20px;

            border-radius: 5px;

            border: 1px solid #ccc;

            box-sizing: border-box;

        }

        button {

            width: 100%;

            padding: 14px;

            background-color: #1e3a8a;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background-color: #172554;

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Diamond Football Academy</h2>

        <a href="/logout">Log ud</a>

    </div>

    <div class="content">

        <div class="card">

            <h1>Book træning</h1>

            <form method="POST">

                <label>Vælg træning</label>

                <select name="training">

                    {% for training in trainings %}

                    <option value="{{ training[0] }}|{{ training[1] }}">

                        {{ training[0] }} -
                        {{ training[1] }}
                        ({{ training[2] }} pladser tilbage)

                    </option>

                    {% endfor %}

                </select>

                <label>Vælg dato</label>

                <input type="date"
                       name="date">

                <button type="submit">

                    Book træning

                </button>

            </form>

        </div>

    </div>

</body>

</html>

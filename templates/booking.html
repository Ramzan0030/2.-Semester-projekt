<!DOCTYPE html>
<html lang="da">

<head>
<meta charset="UTF-8">
<title>Booking</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.navbar{
background:#1e3a8a;
padding:20px;
color:white;
display:flex;
justify-content:space-between;
}

.navbar a{
color:white;
text-decoration:none;
}

.content{
display:flex;
justify-content:center;
padding:40px;
}

.card{
background:white;
padding:40px;
width:500px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

select,input,button{

width:100%;
padding:12px;
margin-bottom:20px;
}

button{

background:#1e3a8a;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="navbar">

<h2>Diamond Football Academy</h2>

<a href="/logout">

Log ud

</a>

</div>

<div class="content">

<div class="card">

<h1>Book træning</h1>

<form method="POST">

<label>Vælg træning</label>

<select name="training">

{% for training in trainings %}

<option value="{{training[0]}}|{{training[1]}}">

{{training[0]}}
-
{{training[1]}}
({{training[2]}} pladser tilbage)

</option>

{% endfor %}

</select>

<label>Vælg dato</label>

<input
type="date"
name="date"
min="2026-05-21"
max="2026-10-21"
>

<button type="submit">

Book træning

</button>

</form>

</div>

</div>

</body>

</html>
